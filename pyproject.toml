[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-parser"
version = "1.0"
description = "A Python project for web parsing"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-late"

authors = [
    { name = "asdftowel", email = "1132220518@rudn.ru" },
    { name = "wolfforever5", email = "1032262069@rudn.ru" },
    { name = "Yeabseragetahun", email = "1032265919@rudn.ru" },
    { name = "daria1407", email = "1132262145@rudn.ru" },
]

classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "beautifulsoup4==4.15.0",
    "selenium==4.51.0",
]

[project.optional-dependencies]
devel = [
    "pytest==9.1.1",
    "mypy==2.4.0",
    "ruff==0.17.1",
]
