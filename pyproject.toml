[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-parser"
version = "1.0.0"
description = "A Python project for web parsing"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
keywords = ["html", "parsing", "pdf", "web-scraper"]

authors = [
    { name = "asdftowel", email = "1132220518@rudn.ru" },
    { name = "wolfforever5", email = "1032262069@rudn.ru" },
    { name = "Yeabseragetahun", email = "1032265919@rudn.ru" },
    { name = "daria1407", email = "1132262145@rudn.ru" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Private :: Do Not Upload", # until it's ready
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

dependencies = [
    "beautifulsoup4==4.15.0",
    "selenium==4.52.0",
]

[project.urls]
Issues = "https://github.com/IoRL-IntelSys-2026/scraper-parser/issues"
Repository = "https://github.com/IoRL-IntelSys-2026/scraper-parser.git"

[project.scripts]
scraper-parser = "cli:main"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 80
output-format = "github"
output-prefer-rule-codes = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
extend-select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "C",
    "D1",
    "D2",
    "D3",
    "D402",
    "D403",
    "D405",
    "D406",
    "D407",
    "D408",
    "D409",
    "D414",
    "D415",
    "D417",
    "D420",
    "DOC",
    "DTZ",
    "EM",
    "FIX",
    "G",
    "ISC001",
    "ISC003",
    "LOG",
    "PERF",
    "PIE",
    "PLC0415",
    "PLC1802",
    "PLC1901",
    "PLC2401",
    "PLC2403",
    "PLC2701",
    "PLC2801",
    "PT",
    "PTH",
    "PYI",
    "RUF036",
    "RUF037",
    "RUF038",
    "RUF039",
    "RUF043",
    "RUF045",
    "RUF052",
    "RUF102",
    "RUF103",
    "RUF104",
    "RUF105",
    "S",
    "SIM",
    "SLOT",
    "TC",
    "TID",
    "TRY",
    "YTT",
]
preview = true

exclude = [
    "D202",
    "D212",
]

[tool.ruff.lint.per-file-ignores]
"**/test*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[project.optional-dependencies]
devel = [
    "pytest==9.2.0",
    "mypy==2.4.1",
    "ruff==0.17.3",
    "build==1.6.1",
]
