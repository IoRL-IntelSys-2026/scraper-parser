name: Python application

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.15
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"
        cache: "pip"
    - name: Install app dependencies
      run: |
        python -m pip install --upgrade pip
        # All dependencies should be pinned to hashes
        pip install -r requirements.txt --only-binary :all: --require-hashes
    - name: Install development dependencies
      run: |
        pip install -r dev-requirements.txt --only-binary :all: --require-hashes
    - name: Typecheck with mypy
      run: |
        echo "::add-matcher::.github/mypy.json"
        python3 -m mypy --strict .
    - name: Lint with ruff
      run: |
        ruff check .
    - name: Test with pytest
      run: |
        pytest
